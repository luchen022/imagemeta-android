plugins { id 'com.android.application' }
android {
    namespace 'com.jaden.imagemeta'
    compileSdk 35
    defaultConfig {
        applicationId 'com.jaden.imagemeta'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        debug {
            if (rootProject.file('signing/development.keystore').exists()) {
                storeFile rootProject.file('signing/development.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes { release { minifyEnabled false } }
    packaging { resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'com.drewnoakes:metadata-extractor:2.19.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
